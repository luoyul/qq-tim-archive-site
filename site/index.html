<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QQ / TIM 历史版本</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 1100px; margin: 0 auto; padding: 24px; line-height: 1.5; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
    h1 { margin: 0; } .status { color: #777; }
    nav { display: flex; gap: 8px; margin: 20px 0; }
    button { padding: 8px 14px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; } th, td { padding: 9px 8px; border-bottom: 1px solid #8885; text-align: left; }
    a { color: #1677d2; } .error { color: #b42318; }
  </style>
</head>
<body>
  <header><h1>QQ / TIM 历史版本</h1><span id="status" class="status">正在读取版本索引...</span></header>
  <nav aria-label="产品筛选"><button data-product="qq">QQ</button><button data-product="tim">TIM</button></nav>
  <main><table><thead><tr><th>版本</th><th>版本号</th><th>大小</th><th>校验</th><th>Release</th></tr></thead><tbody id="versions"></tbody></table></main>
  <script>
    const sources = {
      qq: 'https://raw.githubusercontent.com/luoyul/qq-versions/main/catalog/qq.json',
      tim: 'https://raw.githubusercontent.com/luoyul/tim-versions/main/catalog/tim.json'
    };
    const state = { qq: [], tim: [], product: 'qq' };
    const formatSize = bytes => bytes ? `${(bytes / 1024 / 1024).toFixed(1)} MB` : '-';
    async function load(product) {
      const response = await fetch(sources[product], { cache: 'no-store' });
      if (!response.ok) throw new Error(`${product} catalog HTTP ${response.status}`);
      const data = await response.json();
      state[product] = Array.isArray(data.versions) ? data.versions : [];
    }
    function render() {
      const rows = state[state.product].map(item => `<tr><td>${item.versionName ?? '-'}</td><td>${item.versionCode ?? '-'}</td><td>${formatSize(item.size)}</td><td title="${item.sha256 ?? ''}">${item.sha256 ? item.sha256.slice(0, 12) : '-'}</td><td>${item.releaseUrl ? `<a href="${item.releaseUrl}">下载</a>` : '-'}</td></tr>`).join('');
      document.querySelector('#versions').innerHTML = rows || '<tr><td colspan="5">暂无记录</td></tr>';
    }
    async function start() {
      try { await Promise.all(Object.keys(sources).map(load)); document.querySelector('#status').textContent = '索引已更新'; render(); }
      catch (error) { document.querySelector('#status').textContent = error.message; document.querySelector('#status').className = 'status error'; }
    }
    document.querySelectorAll('button[data-product]').forEach(button => button.addEventListener('click', () => { state.product = button.dataset.product; render(); }));
    start();
  </script>
</body>
</html>
